<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="사이즈코리아 제8차 인체치수조사 20대 데이터 기반 체형 마네킹 미리보기">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>체형 마네킹 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 왼쪽 입력 패널 · 가운데 측정 도면(정면/측면) · 오른쪽 치수표. 좁은 화면에서는 도면 → 입력 → 치수표 순으로 쌓임 */
:root {
  --bg: #eef2f0;
  --panel: #fbfcfb;
  --ink: #1b2420;
  --muted: #5a6964;
  --line: #d3dcd8;
  --grid: #dfe6e3;
  --body: #7f978e;
  --body-arm: #6c847b;
  --body-light: #a9bcb4;
  --body-dark: #5b7268;
  --ghost: #c9a24a;
  --accent: #b5761a;
  --warn-bg: #fbefd9;
  --warn-ink: #7a4b07;
  --good: #2f7a52; --mid: #9a6a09; --low: #a3423a;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --panel: #18201d; --ink: #e3ebe7; --muted: #9aaba4; --line: #2b3632; --grid: #1f2926;
  --body: #6d8a7f; --body-arm: #5b776d; --body-light: #8eaa9f; --body-dark: #4a6258; --ghost: #d8ad4f; --accent: #e3a53e;
  --warn-bg: #3a2c12; --warn-ink: #f2cf8a; --good: #6cc996; --mid: #e3b54f; --low: #f08a7f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111614; --panel: #18201d; --ink: #e3ebe7; --muted: #9aaba4; --line: #2b3632; --grid: #1f2926;
  --body: #6d8a7f; --body-arm: #5b776d; --body-light: #8eaa9f; --body-dark: #4a6258; --ghost: #d8ad4f; --accent: #e3a53e;
  --warn-bg: #3a2c12; --warn-ink: #f2cf8a; --good: #6cc996; --mid: #e3b54f; --low: #f08a7f; color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; }
.wrap { padding-block: 20px 32px; padding-inline: 16px; max-width: 1320px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.src { color: var(--muted); font-size: 12.5px; margin: 0; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 1080px) { .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .stage { grid-column: 1 / -1; order: -1; } }
@media (max-width: 680px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 16px; min-width: 0; }
.panel h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); margin: 0; text-transform: uppercase; }
.field { display: grid; gap: 6px; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field label, .field .lbl { font-weight: 600; font-size: 13.5px; }
.numbox { display: flex; align-items: baseline; gap: 4px; }
.numbox input { width: 72px; font: 500 15px var(--f-num); text-align: right; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.unit { color: var(--muted); font-size: 12px; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.range-ends { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-family: var(--f-num); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 13.5px var(--f-ui); padding: 7px 4px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sliders { display: grid; gap: 12px; }
.sl-val { font: 500 12.5px var(--f-num); color: var(--muted); min-width: 3.5em; text-align: right; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: 500 13px var(--f-ui); padding: 7px 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 7px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; cursor: pointer; }
.check input { accent-color: var(--ghost); width: 16px; height: 16px; }

.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.views { display: grid; grid-template-columns: 880fr 520fr; gap: 8px; align-items: end; } /* 두 그림의 viewBox 폭 비율 → 같은 축척 */
@media (max-width: 520px) { .views { grid-template-columns: 1fr; } }
.view { display: grid; gap: 4px; min-width: 0; }
.view-title { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; display: flex; justify-content: space-between; }
svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.summary b { font: 500 14px var(--f-num); }

.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.warn ul { margin: 4px 0 0; padding-left: 18px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: baseline; }
th { font-weight: 500; color: var(--muted); font-size: 11.5px; letter-spacing: 0.04em; }
td.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
th.n { text-align: right; }
.d-pos { color: var(--accent); } .d-zero { color: var(--muted); }
.chip { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.q-높음 { color: var(--good); } .q-보통 { color: var(--mid); } .q-낮음 { color: var(--low); } .q-선택 { color: var(--accent); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: no-preference) { #fig path, #side path { transition: d 0.12s linear; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>체형 마네킹 미리보기</h1>
    <p class="src">사이즈코리아 제8차 인체치수조사 20대 개인 데이터 회귀(여 575명·남 610명) · 단위 mm</p>
  </header>

  <div class="layout">
    <section class="panel" aria-label="입력">
      <h2>기본 입력</h2>
      <div class="field">
        <span class="lbl">성별</span>
        <div class="seg" role="group" aria-label="성별">
          <button type="button" id="sexF" aria-pressed="true">여성</button>
          <button type="button" id="sexM" aria-pressed="false">남성</button>
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label for="hNum">키</label><span class="numbox"><input id="hNum" type="number" step="0.1" inputmode="decimal"><span class="unit">cm</span></span></div>
        <input id="hRange" type="range" step="0.1" aria-label="키">
        <div class="range-ends"><span id="hMin"></span><span id="hMax"></span></div>
      </div>
      <div class="field">
        <div class="field-head"><label for="wNum">체중</label><span class="numbox"><input id="wNum" type="number" step="0.1" inputmode="decimal"><span class="unit">kg</span></span></div>
        <input id="wRange" type="range" step="0.1" aria-label="체중">
        <div class="range-ends"><span id="wMin"></span><span id="wMax"></span></div>
      </div>
      <div class="field" id="bustField">
        <span class="lbl">가슴 볼륨</span>
        <div class="seg" role="group" aria-label="가슴 볼륨">
          <button type="button" data-bust="small" aria-pressed="false">작음</button>
          <button type="button" data-bust="medium" aria-pressed="true">보통</button>
          <button type="button" data-bust="large" aria-pressed="false">큼</button>
        </div>
      </div>

      <h2>체형 조절</h2>
      <div class="sliders" id="sliders"></div>
      <div class="row-btns">
        <button type="button" class="btn" id="resetSl">조절값 초기화</button>
        <button type="button" class="btn" id="toMean">20대 평균으로</button>
      </div>
      <label class="check"><input type="checkbox" id="ghostOn" checked> 20대 평균 체형 겹쳐 보기</label>
    </section>

    <section class="stage" aria-label="마네킹">
      <div class="summary" id="summary"></div>
      <div class="views">
        <div class="view"><div class="view-title"><span>정면</span><span>눈금 10cm</span></div><svg id="fig" role="img" aria-label="정면 실루엣"></svg></div>
        <div class="view"><div class="view-title"><span>측면 (몸통 두께)</span></div><svg id="side" role="img" aria-label="측면 실루엣"></svg></div>
      </div>
      <div class="legend"><span><i style="background:var(--body)"></i>입력 체형</span><span><i style="background:var(--ghost);opacity:.45"></i>같은 성별 20대 평균</span><span><i style="background:var(--accent)"></i>치수선</span></div>
    </section>

    <section class="panel" aria-label="치수">
      <div class="warn" id="warn" hidden></div>
      <h2>마네킹 치수</h2>
      <table><thead><tr><th>항목</th><th class="n">값</th><th class="n">평균 대비</th></tr></thead><tbody id="tblA"></tbody></table>
      <h2>둘레 참고</h2>
      <table><thead><tr><th>항목</th><th class="n">값</th><th>신뢰도</th></tr></thead><tbody id="tblB"></tbody></table>
      <p class="note">신뢰도는 키·체중으로 설명되는 정도(검증 R²)입니다. 같은 키·체중이어도 사람마다 오차(±)만큼 다를 수 있어요. 결과는 그 키·체중의 평균적인 체형입니다.</p>
    </section>
  </div>
</div>

<script>
(function () {
  const COEF = JSON.parse(document.getElementById('coef').textContent);
  const PI = Math.PI, r1 = v => Math.round(v * 10) / 10, clampN = v => Math.max(-1, Math.min(1, v || 0));

  /* ── bodyKeypoints.ts 와 같은 계산 (JS 이식) ── */
  function bodyKeypoints(input) {
    const sex = input.sex, s = COEF[sex], warnings = [];
    const clampRange = (v, r, label, unit) => {
      if (v < r.min) { warnings.push(`${label} ${v}${unit} → 데이터 최소 ${r.min}${unit}로 보정했어요`); return r.min; }
      if (v > r.max) { warnings.push(`${label} ${v}${unit} → 데이터 최대 ${r.max}${unit}로 보정했어요`); return r.max; }
      if (v < r.p5 || v > r.p95) warnings.push(`${label} ${v}${unit}는 드문 범위(상·하위 5%)라 정확도가 낮아요`);
      return v;
    };
    const h = clampRange(input.heightCm, s.height_cm, '키', 'cm');
    const w = clampRange(input.weightKg, s.weight_kg, '체중', 'kg');
    const H = h * 10;
    const sl = {}; for (const k of ['shoulder', 'waist', 'hip', 'legLength', 'armLength']) sl[k] = clampN((input.sliders || {})[k]);
    const item = n => { const c = s.items[n]; if (!c) throw new Error('항목 없음: ' + n); return c; };
    const val = n => { const c = item(n); return c.a + c.b_height * h + c.c_weight * w; };
    const sd = n => item(n).rmse;
    const dW = (n, x) => x * sd(n) / 2;

    const headH = val('머리수직길이'), headBottom = H - headH;
    const head = { centerY: H - headH / 2, halfHeight: headH / 2, halfWidth: val('머리너비') / 2, halfDepth: val('머리두께') / 2 };
    const neckHW = val('목둘레') / (2 * PI);
    const shoulderHW = val('어깨사이너비') / 2 + dW('어깨사이너비', sl.shoulder);
    const chestHW = val('가슴너비') / 2, chestHD = val('가슴두께') / 2;
    const wHW0 = val('허리너비') / 2, wHD0 = val('허리두께') / 2, wHW = wHW0 + dW('허리너비', sl.waist);
    const nHW0 = val('배꼽수준허리너비') / 2, nHD0 = val('배꼽수준허리두께') / 2, nHW = nHW0 + dW('허리너비', sl.waist);
    const hHW0 = val('엉덩이너비') / 2, hHD0 = val('엉덩이두께') / 2, hHW = hHW0 + dW('엉덩이너비', sl.hip);

    let crotchY = val('샅높이'), kneeY = val('무릎높이');
    const legDelta = sl.legLength * sd('샅높이');
    kneeY += legDelta * (kneeY / crotchY); crotchY += legDelta;

    const torso = [
      { name: 'neckTop', y: headBottom, halfWidth: neckHW, halfDepth: neckHW },
      { name: 'neckBase', y: Math.min(val('목뒤높이'), headBottom - 25), halfWidth: neckHW, halfDepth: neckHW },
      { name: 'shoulder', y: val('어깨가쪽높이'), halfWidth: shoulderHW, halfDepth: chestHD * 0.85 },
      { name: 'armpit', y: val('겨드랑높이'), halfWidth: chestHW, halfDepth: chestHD },
    ];
    let cup = null;
    if (sex === 'F') {
      const b = COEF.extras.F.bust, level = input.bust || 'medium';
      cup = b.cupMm[level];
      torso.push({ name: 'bust',

    $('fig').setAttribute('viewBox', '-420 0 880 1980');
    $('fig').innerHTML = STYLE + grid(-410, 440) + (state.ghost ? figureFront(g, 'ghost') : '') + figureFront(k, 'me') + dims(k);
    $('side').setAttribute('viewBox', '-260 0 520 1980');
    $('side').innerHTML = STYLE + grid(-250, 260) + (state.ghost ? figureSide(g, 'ghost') : '') + figureSide(k, 'me');

    const bmi = k.w / Math.pow(k.h / 100, 2);
    $('summary').innerHTML = `<span>${state.sex === 'F' ? '여성' : '남성'}</span><span>키 <b>${r1(k.h)}</b> cm</span><span>체중 <b>${r1(k.w)}</b> kg</span><span>BMI <b>${bmi.toFixed(1)}</b></span>`;

    const w = $('warn');
    if (k.warnings.length) { w.hidden = false; w.innerHTML = '<b>입력 범위 안내</b><ul>' + k.warnings.map(x => `<li>${x}</li>`).join('') + '</ul>'; }
    else w.hidden = true;

    const pick = (kk, n) => kk.torso.find(p => p.name === n);
    const rowsA = [
      ['어깨 폭', kp => pick(kp, 'shoulder').halfWidth * 2],
      ['겨드랑 높이 가슴 폭', kp => pick(kp, 'armpit').halfWidth * 2],
      ...(state.sex === 'F' ? [['젖가슴 폭', kp => pick(kp, 'bust').halfWidth * 2], ['젖가슴 두께', kp => pick(kp, 'bust').halfDepth * 2]] : []),
      ['허리 폭', kp => pick(kp, 'waist').halfWidth * 2],
      ['엉덩이 폭', kp => pick(kp, 'hip').halfWidth * 2],
      ['다리 안쪽 길이 (샅높이)', kp => kp.crotchY],
      ['팔 길이', kp => kp.armLen]];
    $('tblA').innerHTML = rowsA.map(([n, fn]) => {
      const v = fn(k), d = v - fn(g), dr = Math.round(d);
      return `<tr><td>${n}</td><td class="n">${Math.round(v)}</td><td class="n ${dr === 0 ? 'd-zero' : 'd-pos'}">${dr > 0 ? '+' : ''}${dr}</td></tr>`;
    }).join('');
    const it = n => s.items[n];
    const rowsB = state.sex === 'F'
      ? [['젖가슴둘레', k.girth.chest, '선택', '가슴 볼륨 선택 반영'], ['허리둘레', k.girth.waist, it('허리둘레').quality, '±' + it('허리둘레').rmse],
         ['엉덩이둘레', k.girth.hip, it('엉덩이둘레').quality, '±' + it('엉덩이둘레').rmse], ['넙다리둘레', k.girth.thigh, it('넙다리둘레').quality, '±' + it('넙다리둘레').rmse]]
      : [['가슴둘레', k.girth.chest, it('가슴둘레').quality, '±' + it('가슴둘레').rmse], ['허리둘레', k.girth.waist, it('허리둘레').quality, '±' + it('허리둘레').rmse],
         ['엉덩이둘레', k.girth.hip, it('엉덩이둘레').quality, '±' + it('엉덩이둘레').rmse], ['넙다리둘레', k.girth.thigh, it('넙다리둘레').quality, '±' + it('넙다리둘레').rmse]];
    $('tblB').innerHTML = rowsB.map(([n, v, q, e]) => `<tr><td>${n}</td><td class="n">${Math.round(v)}</td><td><span class="chip q-${q}" title="${e}">${q === '선택' ? '선택값' : q} ${q === '선택' ? '' : e}</span></td></tr>`).join('');
  }

  function update() { syncInputs(); render(); }
  function setSex(x) {
    if (state.sex === x) return;
    state.sex = x; state.h = COEF[x].height_cm.mean; state.w = COEF[x].weight_kg.mean; update();
  }
  $('sexF').onclick = () => setSex('F'); $('sexM').onclick = () => setSex('M');
  for (const id of ['h', 'w']) {
    $(id + 'Range').addEventListener('input', e => { state[id] = parseFloat(e.target.value); update(); });
    $(id + 'Num').addEventListener('input', e => { const v = parseFloat(e.target.value); if (isFinite(v) && v > 0) { state[id] = v; syncInputs(); render(); } });
    $(id + 'Num').addEventListener('change', () => syncInputs());
  }
  document.querySelectorAll('[data-bust]').forEach(b => b.onclick = () => { state.bust = b.dataset.bust; update(); });
  for (const [k] of SL) $('sl_' + k).addEventListener('input', e => { state.sliders[k] = parseFloat(e.target.value); update(); });
  $('resetSl').onclick = () => { for (const [k] of SL) state.sliders[k] = 0; state.bust = 'medium'; update(); };
  $('toMean').onclick = () => { state.h = COEF[state.sex].height_cm.mean; state.w = COEF[state.sex].weight_kg.mean; update(); };
  $('ghostOn').onchange = e => { state.ghost = e.target.checked; render(); };
  update();
})();
</script>

</body>
</html>
